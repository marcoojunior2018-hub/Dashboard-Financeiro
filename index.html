<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>Central do Arquiteto Soberano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffba1a; --gold-dark:#b87f00; --gold-mid:#ffca4a; --gold-light:#ffd66b;
  --cream:#FFF8E6; --black:#0D1117; --soft:#161B22; --card:#1C2333; --card-2:#232B3D;
  --text:var(--cream); --text-2:rgba(255,248,230,.80); --text-mid:rgba(255,248,230,.58);
  --text-soft:rgba(255,248,230,.38);
  --border:rgba(255,244,221,.09); --border-2:rgba(255,244,221,.17);
  --success:#3FB950; --danger:#F85149;
  --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --shadow-cta:0 15px 25px -10px rgba(255,186,26,.45),inset 0 4px 8px rgba(255,221,138,.55),inset 0 -4px 8px rgba(255,162,0,.45);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--black);color:var(--text);font-family:var(--font-sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 16px}
@media(min-width:760px){.container{padding:0 28px}}
.num{font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:.95}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-soft)}
.sub{font-size:12.5px;color:var(--text-mid);line-height:1.45}
.gold{color:var(--gold)} .ok{color:var(--success)} .bad{color:var(--danger)}
.vazio{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--gold-dark);
  background:rgba(255,186,26,.10);padding:2px 7px;border-radius:5px;white-space:nowrap}

/* ---------- topo ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.92);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:10px;flex:none;
  background:radial-gradient(120% 140% at 50% 0%,#FFE49A 0%,#FFD24A 38%,#FFBA1A 100%);
  display:grid;place-items:center;color:#0D1117;font-weight:800;font-size:15px}
.brand b{font-size:14px;font-weight:700;display:block;line-height:1.2}
.brand .sub{font-size:11px}
.mes{display:flex;align-items:center;gap:2px;flex:none}
.mes button{width:32px;height:32px;border-radius:999px;border:1px solid var(--border-2);
  background:transparent;color:var(--text);cursor:pointer;font-size:16px;line-height:1}
.mes b{font-size:13px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
nav.abas{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{flex:none;padding:8px 16px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:var(--text-mid);font-family:var(--font-sans);font-size:13px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .25s var(--ease)}
nav.abas button:hover{color:var(--text)}
nav.abas button.on{background:var(--gold);color:#0D1117}

/* ---------- cards ---------- */
main{padding:16px 0 130px}
.card{background:var(--soft);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:14px}
.card-deep{background:var(--card)}
.card h2{margin:0 0 16px;font-size:10.5px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-soft)}

/* HERO — o número que manda */
.hero{position:relative;overflow:hidden;border:0;border-radius:24px;padding:26px 24px;margin-bottom:14px;
  background:radial-gradient(130% 150% at 15% 0%,#FFE49A 0%,#FFD24A 34%,#FFBA1A 78%,#F0A800 100%);
  color:#0D1117;box-shadow:0 22px 44px -22px rgba(255,186,26,.5)}
.hero .eyebrow{color:rgba(13,17,23,.62)}
.hero .valor{font-weight:800;letter-spacing:-.045em;line-height:.92;
  font-size:clamp(44px,11vw,76px);margin:12px 0 4px;font-variant-numeric:tabular-nums}
.hero .linha{display:flex;flex-wrap:wrap;gap:0;margin-top:20px;
  border-top:1px solid rgba(13,17,23,.16);padding-top:16px}
.hero .mini{flex:1 1 33%;min-width:96px}
.hero .mini span{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(13,17,23,.58)}
.hero .mini b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:3px;
  font-variant-numeric:tabular-nums}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:var(--soft);border:1px solid var(--border);border-radius:18px;padding:18px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:8px;
  font-variant-numeric:tabular-nums}
@media(min-width:900px){
  .topo{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
  .topo .hero{margin-bottom:0}
  .kpis{grid-template-columns:1fr;margin-bottom:0;gap:12px}
  .colunas{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .colunas>div{min-width:0}
}

/* âncora */
.ancora{background:var(--card);border-left:2px solid var(--gold)}
.ancora .eixo{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.ancora .dir{font-size:16.5px;font-weight:700;line-height:1.32;margin:9px 0 13px;letter-spacing:-.01em}
.ancora .ln{display:flex;gap:11px;font-size:12.5px;color:var(--text-mid);margin-top:7px}
.ancora .ln b{color:var(--text-2);font-weight:800;flex:none;min-width:56px;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding-top:1px}

/* linhas */
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:13px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:none;padding-top:0}
.row:last-child{padding-bottom:0}
.nm{min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:600}
.nm .sub{font-weight:400;margin-top:2px}
.vl{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}

/* progresso */
.prog{padding:16px 0;border-top:1px solid var(--border)}
.prog:first-of-type{border-top:none;padding-top:0}
.prog .cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prog .t{font-size:14px;font-weight:700}
.prog .v{font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;white-space:nowrap}
.prog .v i{font-style:normal;font-size:12px;font-weight:600;color:var(--text-soft)}
.bar{height:9px;border-radius:999px;background:rgba(255,244,221,.07);overflow:hidden;
  display:flex;margin:10px 0 7px}
.bar i{height:100%;display:block;border-radius:999px;transition:width .7s var(--ease)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;
  font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  white-space:nowrap;margin-left:7px;vertical-align:1px}
.badge--danger{background:rgba(248,81,73,.16);color:#ff8e89}
.badge--gold{background:rgba(255,186,26,.16);color:var(--gold)}
.badge--dark{background:rgba(255,244,221,.08);color:var(--text-soft)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-sans);
  font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px;border:1px solid transparent;
  cursor:pointer;transition:transform .3s var(--ease),background .3s var(--ease)}
.btn--primary{background:radial-gradient(120% 140% at 50% 0%,#FFE49A 0%,#FFD24A 38%,#FFBA1A 100%);
  color:#0D1117;box-shadow:var(--shadow-cta)}
.btn--primary:active{transform:translateY(1px)}
.btn--ghost{background:rgba(255,244,221,.06);color:var(--text-2);border-color:var(--border-2)}
.btn--ghost:hover{background:rgba(255,244,221,.11);color:var(--text)}
.btn--sm{padding:7px 14px;font-size:12px}
.btn--block{width:100%}
.maisbtn{width:100%;margin-top:14px;background:transparent;border:1px dashed var(--border-2);
  color:var(--text-mid);padding:10px;border-radius:12px;font-family:var(--font-sans);
  font-size:12.5px;font-weight:700;cursor:pointer}
.maisbtn:hover{color:var(--text);border-color:var(--text-soft)}
.seg{display:flex;gap:4px;background:rgba(255,244,221,.05);padding:4px;border-radius:999px;margin-bottom:16px}
.seg button{flex:1;padding:9px 8px;border-radius:999px;border:0;background:transparent;
  color:var(--text-mid);font-family:var(--font-sans);font-size:12.5px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--card-2);color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-soft);font-weight:800;padding:0 0 8px}
td{padding:11px 0;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
td:first-child{overflow-wrap:anywhere;padding-right:12px;font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}

.aviso{background:rgba(255,186,26,.07);border:1px solid rgba(255,186,26,.24);color:var(--gold-light);
  font-size:12.5px;padding:12px 14px;border-radius:12px;margin-top:14px;line-height:1.5}
.erro{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.3);color:#ffb4b1}
.hint{font-size:11.5px;color:var(--text-soft);margin-top:14px;line-height:1.55}
.faixa{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--border-2);border-radius:12px;padding:9px 14px;margin-bottom:14px;
  font-size:12.5px;color:var(--text-2)}
.pt{width:7px;height:7px;border-radius:50%;flex:none}
code{background:rgba(255,244,221,.08);padding:1px 6px;border-radius:5px;font-size:12px;overflow-wrap:anywhere}
ol.passos{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--text-2);line-height:1.75}

/* lançamento */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;
  padding:16px 34px;font-size:15px;box-shadow:var(--shadow-cta),0 14px 34px rgba(0,0,0,.55)}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(5,7,10,.74);backdrop-filter:blur(7px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--soft);border:1px solid var(--border-2);border-radius:26px 26px 0 0;
  width:100%;max-width:540px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto}
@media(min-width:620px){.sheet{align-items:center}.sheet-in{border-radius:26px}}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.valor-in{width:100%;background:transparent;border:0;border-bottom:2px solid var(--border-2);
  color:var(--text);font-family:var(--font-sans);font-weight:800;font-size:44px;letter-spacing:-.04em;
  padding:10px 0;outline:none;font-variant-numeric:tabular-nums}
.valor-in:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--border-2);background:transparent;
  color:var(--text-2);font-family:var(--font-sans);font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0D1117;font-weight:700}
.campo{margin-top:20px}
.campo>.eyebrow{margin-bottom:2px;display:block}
input[type=text],input[type=url],input[type=password]{
  width:100%;background:rgba(255,244,221,.05);border:1px solid var(--border-2);color:var(--text);
  border-radius:12px;padding:12px 14px;font-family:var(--font-sans);font-size:15px;outline:none}
input:focus{border-color:var(--gold)}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-in{width:100%;max-width:400px}
.gate h1{font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:0 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:90;
  background:var(--card-2);border:1px solid var(--border-2);color:var(--text);padding:12px 20px;
  border-radius:999px;font-size:13px;font-weight:700;max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
.spin{width:16px;height:16px;border:2px solid rgba(255,244,221,.25);border-top-color:var(--gold);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
svg{display:block;width:100%;height:auto}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-in">
    <div class="mark" style="width:46px;height:46px;border-radius:14px;font-size:20px;margin-bottom:20px">A</div>
    <h1>Central do<br>Arquiteto Soberano</h1>
    <p class="sub" id="gateMsg" style="font-size:14px">Cole a URL da API da planilha e o seu PIN.</p>
    <div class="campo"><span class="eyebrow">URL da API</span>
      <input type="url" id="gUrl" placeholder="https://script.google.com/macros/s/.../exec"
        autocomplete="off" style="margin-top:8px"></div>
    <div class="campo"><span class="eyebrow">PIN</span>
      <input type="password" id="gPin" inputmode="numeric" autocomplete="off" style="margin-top:8px"></div>
    <button class="btn btn--primary btn--block" id="gBtn" style="margin-top:22px">Conectar</button>
    <button class="btn btn--ghost btn--block" id="gSkip" style="margin-top:9px">Ver sem conectar</button>
    <p class="hint">Fica salvo só neste navegador. Nada sai daqui além da sua própria planilha.</p>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="container">
      <div class="hd">
        <div class="brand">
          <div class="mark">A</div>
          <div><b>Arquiteto Soberano</b><span class="sub" id="fonteLbl">carregando…</span></div>
        </div>
        <div class="mes">
          <button id="prev" aria-label="Mês anterior">&#8249;</button>
          <b id="mesLbl">—</b>
          <button id="next" aria-label="Próximo mês">&#8250;</button>
        </div>
      </div>
      <nav class="abas">
        <button data-aba="hoje" class="on">Hoje</button>
        <button data-aba="degrau">Degrau 1</button>
        <button data-aba="dividas">Dívidas</button>
        <button data-aba="historico">Histórico</button>
      </nav>
    </div>
  </header>
  <main><div class="container" id="conteudo"></div></main>
</div>

<button class="btn btn--primary fab" id="fab" style="display:none">Lançar gasto</button>

<div class="sheet" id="sheet"><div class="sheet-in">
  <h3>Lançar</h3>
  <p class="sub" id="sheetSub">Sai do caixa na hora.</p>
  <input class="valor-in" id="fValor" inputmode="decimal" placeholder="0,00" autocomplete="off">
  <div class="campo"><span class="eyebrow">Categoria</span><div class="chips" id="fCats"></div></div>
  <div class="campo"><span class="eyebrow">Conta</span><div class="chips" id="fContas"></div></div>
  <div class="campo"><span class="eyebrow">Descrição — opcional</span>
    <input type="text" id="fDesc" placeholder="ex.: almoço" autocomplete="off" style="margin-top:8px"></div>
  <div class="campo"><div class="chips">
    <button class="chip on" data-tipo="saida">Saída</button>
    <button class="chip" data-tipo="entrada">Entrada</button></div></div>
  <div style="display:flex;gap:9px;margin-top:24px">
    <button class="btn btn--ghost" id="fCancel" style="flex:1">Cancelar</button>
    <button class="btn btn--primary" id="fOk" style="flex:2">Confirmar</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CENTRAL DO ARQUITETO SOBERANO
   Front estático. A planilha é o banco. Se ela não responder,
   abre com a cópia local e diz o que quebrou.
   Nenhum valor de dinheiro está escrito neste código.
   ========================================================= */
const ABAS=['transacoes','categorias','dividas','metas','contas','recorrentes',
            'degrau','ancoragem','filtros','habilidades'];
const CFG={
  get url(){return localStorage.getItem('as_url')||''},
  set url(v){localStorage.setItem('as_url',v)},
  get pin(){return localStorage.getItem('as_pin')||''},
  set pin(v){localStorage.setItem('as_pin',v)},
  limpar(){localStorage.removeItem('as_url');localStorage.removeItem('as_pin')}
};
let BASE=vazio(), MES='', TIPO='saida', CAT='', CONTA='', ocupado=false;
let ONLINE=false, ULTIMO_ERRO='';
function vazio(){const o={};ABAS.forEach(a=>o[a]=[]);return o}

/* ---------- utilidades ---------- */
const BRL=v=>(v==null||isNaN(v))?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=new Date();
const ymd=d=>{const z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const comp=d=>ymd(d).slice(0,7);
const brData=s=>{const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
function nomeMes(c){
  const p=String(c||'').split('-'); if(p.length<2) return '—';
  const m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+p[1]-1];
  return m?m+'/'+p[0].slice(2):'—';
}
const diasNoMes=c=>{const [a,m]=c.split('-').map(Number);return new Date(a,m,0).getDate()};
function addMes(c,n){
  if(!/^\d{4}-\d{2}$/.test(String(c||''))) return comp(hoje);
  const [a,m]=c.split('-').map(Number), d=new Date(a,m-1+n,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function num(v){
  if(v==null) return null;
  let s=String(v).trim();
  if(!s||/PREENCHER/i.test(s)) return null;
  s=s.replace(/[R$\s]/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function toast(m,ms=3000){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms);
}
function parseCSV(txt){
  txt=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').trim();
  if(!txt) return [];
  const linhas=[];let campo='',linha=[],aspas=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(aspas){ if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++} else aspas=false } else campo+=c }
    else if(c==='"') aspas=true;
    else if(c===','){linha.push(campo);campo=''}
    else if(c==='\n'){linha.push(campo);linhas.push(linha);linha=[];campo=''}
    else campo+=c;
  }
  linha.push(campo);linhas.push(linha);
  const cab=linhas.shift().map(h=>h.trim());
  return linhas.filter(l=>l.some(c=>c.trim()!=='')).map(l=>{
    const o={};cab.forEach((h,i)=>o[h]=(l[i]||'').trim());return o});
}
function lerEmbutido(){
  const o=vazio();
  ABAS.forEach(a=>{const el=document.getElementById('csv_'+a);
    if(el) o[a]=parseCSV(el.textContent)});
  return o;
}
function normalizar(b){
  const o=vazio();
  ABAS.forEach(a=>{ if(Array.isArray(b&&b[a])) o[a]=b[a] });
  return o;
}

/* ---------- conexão: fetch e, se o CORS barrar, JSONP ----------
   O navegador bloqueia XHR/fetch para script.google.com vindo de outro
   domínio. Uma tag <script src> não sofre essa restrição — é o caminho
   que funciona. Tentamos fetch primeiro; se falhar, cai no JSONP. */
function montarURL(params,cb){
  const u=new URL(CFG.url);
  u.searchParams.set('pin',CFG.pin);
  Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  if(cb) u.searchParams.set('callback',cb);
  return u.toString();
}
function viaJSONP(params,timeout=20000){
  return new Promise((ok,falha)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const limpar=()=>{delete window[cb];s.remove();clearTimeout(t)};
    const t=setTimeout(()=>{limpar();falha(new Error('a planilha não respondeu em 20s'))},timeout);
    window[cb]=d=>{limpar();ok(d)};
    s.onerror=()=>{limpar();falha(new Error('não consegui carregar a URL da API'))};
    s.src=montarURL(params,cb);
    document.body.appendChild(s);
  });
}
async function viaFetch(params){
  const r=await fetch(montarURL(params),{method:'GET',redirect:'follow'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const t=await r.text();
  try{ return JSON.parse(t) }
  catch(e){ throw new Error('a resposta não era JSON') }
}
async function api(params){
  let j,erroFetch='';
  try{ j=await viaFetch(params) }
  catch(e){ erroFetch=e.message; j=await viaJSONP(params) }
  if(!j) throw new Error('resposta vazia'+(erroFetch?' ('+erroFetch+')':''));
  if(j.erro==='pin') throw new Error('PIN incorreto');
  if(j.erro) throw new Error(j.erro);
  return j;
}

/* ---------- cálculos ---------- */
const contasDisp=()=>BASE.contas.filter(c=>(c.entra_no_disponivel||'sim').toLowerCase()!=='nao');
const txDoMes=m=>BASE.transacoes.filter(t=>(t.competencia||'').slice(0,7)===m);
const feito=t=>(t.status||'').toLowerCase()==='realizado';

function situacao(){
  const disp=contasDisp().map(c=>c.id);
  const ini=contasDisp().reduce((s,c)=>s+(num(c.saldo_inicio_mes)||0),0);
  const carimbado=BASE.contas.filter(c=>!disp.includes(c.id))
    .reduce((s,c)=>s+(num(c.saldo_inicio_mes)||0),0);
  const desatual=BASE.contas.length>0&&BASE.contas.some(c=>(c.mes_referencia||'')!==MES);
  const tx=txDoMes(MES);
  const f=(tipo,prev)=>tx.filter(t=>t.tipo===tipo&&(prev?!feito(t):feito(t))&&disp.includes(t.conta))
    .reduce((s,t)=>s+(num(t.valor)||0),0);
  const entradaPrev=f('entrada',true),entradaReal=f('entrada',false);
  const saidaPrev=f('saida',true),saidaReal=f('saida',false);
  const caixa=ini+entradaReal-saidaReal;
  return {ini,caixa,carimbado,entradaPrev,entradaReal,saidaPrev,saidaReal,
          livre:caixa+entradaPrev-saidaPrev,desatual};
}
const aPagar=()=>txDoMes(MES).filter(t=>t.tipo==='saida'&&!feito(t))
  .sort((a,b)=>(num(b.valor)||0)-(num(a.valor)||0));

function cotas(){
  const mapa={};
  BASE.categorias.forEach(c=>{mapa[c.nome]={nome:c.nome,grupo:c.grupo,cota:num(c.cota_mensal)||0,
    origem:c.origem_da_cota||'',gasto:0,previsto:0,gastoDiario:0}});
  txDoMes(MES).filter(t=>t.tipo==='saida').forEach(t=>{
    const k=t.categoria||'Outros';
    if(!mapa[k]) mapa[k]={nome:k,grupo:'variavel',cota:0,origem:'sem cota',gasto:0,previsto:0,gastoDiario:0};
    const v=num(t.valor)||0;
    if(feito(t)){ mapa[k].gasto+=v;
      if((t.recorrente||'').toLowerCase()!=='sim'&&!t.total_parcelas) mapa[k].gastoDiario+=v;
    } else mapa[k].previsto+=v;
  });
  const dia=(MES===comp(hoje))?hoje.getDate():diasNoMes(MES), dm=diasNoMes(MES);
  return Object.values(mapa).map(c=>{
    c.total=c.gasto+c.previsto;
    c.projecao=c.gastoDiario>0?(c.gastoDiario/dia*dm)+(c.gasto-c.gastoDiario)+c.previsto:c.total;
    c.estourou=c.cota>0&&c.total>c.cota+.005;
    c.risco=!c.estourou&&c.cota>0&&c.projecao>c.cota+.005;
    c.sobra=c.cota-c.total;return c;
  }).filter(c=>c.cota>0||c.total>0)
    .sort((a,b)=>(b.estourou-a.estourou)||(b.risco-a.risco)||(b.cota-a.cota));
}
function degrau(){
  const disp=contasDisp().map(c=>c.id);
  const ent=txDoMes(MES).filter(t=>t.tipo==='entrada');
  const fonte={
    renda_trabalho:ent.filter(t=>disp.includes(t.conta)).reduce((a,t)=>a+(num(t.valor)||0),0),
    renda_total:ent.reduce((a,t)=>a+(num(t.valor)||0),0),
    reserva:BASE.contas.filter(c=>(c.papel||'')==='reserva')
      .reduce((a,c)=>a+(num(c.saldo_inicio_mes)||0),0),
    passivos:BASE.dividas.reduce((a,d)=>a+(num(d.saldo_atual)||0),0)};
  const semSaldo=BASE.dividas.filter(d=>num(d.saldo_atual)==null).length;
  return BASE.degrau.map(g=>{
    const atual=fonte[g.fonte_calculo],piso=num(g.valor_piso)||0,teto=num(g.valor_teto)||0;
    const red=g.unidade==='reducao';
    return {nome:g.nome,atual,piso,teto,red,
      prog:red?(atual>0?0:100):(piso>0?Math.min(100,atual/piso*100):0),
      falta:red?atual:Math.max(0,piso-atual),
      semSaldo:g.fonte_calculo==='passivos'?semSaldo:0};
  }).filter(g=>g.atual!=null);
}
const dividasAtivas=()=>BASE.dividas.map(d=>({nome:d.credor,saldo:num(d.saldo_atual),
  taxa:num(d.taxa_juros_mensal),parcela:num(d.valor_parcela)||0,
  semTaxa:num(d.taxa_juros_mensal)==null})).filter(d=>d.saldo>0);
function simular(ordem,orc){
  const ds=ordem.map(d=>({...d,s:d.saldo,t:(d.taxa||0)/100}));
  let juros=0,m=0;
  while(ds.some(d=>d.s>.01)){
    if(++m>600) return {impossivel:true};
    let caixa=orc;
    ds.forEach(d=>{if(d.s>0){const j=d.s*d.t;d.s+=j;juros+=j}});
    ds.forEach(d=>{if(d.s>0){const p=Math.min(d.parcela,d.s,caixa);d.s-=p;caixa-=p}});
    for(const d of ds){if(caixa<=0)break;if(d.s>0){const p=Math.min(d.s,caixa);d.s-=p;caixa-=p}}
    if(caixa===orc) return {impossivel:true};
  }
  return {meses:m,juros};
}
function metas(){
  const inv=BASE.categorias.filter(c=>c.grupo==='investimento').map(c=>c.nome);
  let ap=0;
  for(let i=1;i<=3;i++) ap+=txDoMes(addMes(comp(hoje),-i))
    .filter(t=>t.tipo==='saida'&&feito(t)&&inv.includes(t.categoria))
    .reduce((s,t)=>s+(num(t.valor)||0),0);
  const ritmo=ap/3;
  return BASE.metas.map(m=>{
    const alvo=num(m.valor_alvo),atual=num(m.valor_atual)||0;
    let rest=null;
    if(m.data_alvo){const d=new Date(m.data_alvo+'T00:00:00');
      rest=Math.max(1,Math.round((d-hoje)/(1000*60*60*24*30.44)))}
    const falta=alvo!=null?Math.max(0,alvo-atual):null;
    return {nome:m.nome,alvo,atual,falta,rest,nec:(falta!=null&&rest)?falta/rest:null,ritmo};
  });
}
function historico(){
  const out=[];
  for(let i=11;i>=0;i--){
    const m=addMes(MES,-i),tx=txDoMes(m);
    const e=tx.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+(num(t.valor)||0),0);
    const s=tx.filter(t=>t.tipo==='saida').reduce((a,t)=>a+(num(t.valor)||0),0);
    out.push({mes:m,e,s,r:e-s,fut:m>=comp(hoje)});
  }
  return out;
}

/* ---------- render ---------- */
const barra=p=>'<div class="bar">'+p.map(x=>

      <li>A URL precisa terminar em <code>/exec</code>, não em <code>/dev</code>.</li>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">

function desenhar(){
  document.getElementById('mesLbl').textContent=nomeMes(MES);
  document.querySelectorAll('nav.abas button').forEach(b=>
    b.classList.toggle('on',b.dataset.aba===ABA));

  if(!BASE.transacoes.length&&!BASE.categorias.length){
    document.getElementById('conteudo').innerHTML=faixaEstado()+cardDiagnostico()+
      `<div class="card"><h2>Base vazia</h2><p class="sub">A planilha respondeu, mas não veio linha
       nenhuma. As abas precisam se chamar exatamente:
       ${ABAS.map(a=>'<code>'+a+'</code>').join(', ')}.</p></div>`;
    ligar(); return;
  }
  const h=faixaEstado()+cardDiagnostico()+
    (ABA==='hoje'?abaHoje():ABA==='degrau'?abaDegrau():ABA==='dividas'?abaDividas():abaHistorico());
  document.getElementById('conteudo').innerHTML=h;
  ligar();
}

/* ============ ABA: HOJE ============ */
function abaHoje(){
  const s=situacao(); let h='';

  h+=`<div class="topo">
    <div class="hero">
      <div class="eyebrow">Posso gastar até o fim de ${nomeMes(MES)}</div>
      <div class="valor">${BRL(s.livre)}</div>
      <div class="linha">
        <div class="mini"><span>Em conta</span><b>${BRL(s.caixa)}</b></div>
        <div class="mini"><span>A receber</span><b>${BRL(s.entradaPrev)}</b></div>
        <div class="mini"><span>A pagar</span><b>${BRL(s.saidaPrev)}</b></div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Já gastei</div><b>${BRL(s.saidaReal)}</b>
        <div class="sub" style="margin-top:4px">${nomeMes(MES)} até hoje</div></div>
      <div class="kpi"><div class="eyebrow">Vale iFood</div><b class="gold">${BRL(s.carimbado)}</b>
        <div class="sub" style="margin-top:4px">carimbado, só comida</div></div>
    </div></div>`;

  if(s.desatual) h+=`<div class="aviso">Saldos com mês de referência antigo. Atualize
    <b>saldo_inicio_mes</b> e <b>mes_referencia</b> na aba <b>contas</b>, senão o caixa vai errando.</div>`;

  const dias=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
  const a=BASE.ancoragem.find(x=>(x.dia||'').toLowerCase()===dias[hoje.getDay()]);
  if(a) h+=`<div class="card ancora" style="margin-top:14px">
    <div class="eixo">${esc(a.eixo)} &middot; ${esc(a.dia)}</div>
    <div class="dir">${esc(a.diretriz)}</div>
    <div class="ln"><b>Corpo</b><span>${esc(a.corpo)}</span></div>
    <div class="ln"><b>Decisão</b><span>${esc(a.decisao)}</span></div></div>`;

  h+='<div class="colunas">';

  /* a pagar */
  const ap=aPagar(), lim=verTudo.ap?ap.length:4;
  h+='<div>';
  if(ap.length){
    const total=ap.reduce((x,t)=>x+(num(t.valor)||0),0);
    h+=`<div class="card"><h2>A pagar &middot; ${ap.length} contas &middot; ${BRL(total)}</h2>`;
    ap.slice(0,lim).forEach(t=>{
      h+=`<div class="row"><div class="nm">${esc(t.descricao)}
        ${t.total_parcelas?`<span class="badge badge--dark">${esc(t.parcela_atual)}/${esc(t.total_parcelas)}</span>`:''}
        <div class="sub">${esc(t.categoria||'')}</div></div>
        <div style="display:flex;align-items:center;gap:12px;flex:none">
        <span class="vl">${BRL(num(t.valor))}</span>
        <button class="btn btn--ghost btn--sm" data-quitar="${esc(t.id)}">Paguei</button></div></div>`});
    if(ap.length>lim) h+=`<button class="maisbtn" data-mais="ap">Ver as outras ${ap.length-lim}</button>`;
    else if(verTudo.ap&&ap.length>4) h+=`<button class="maisbtn" data-mais="ap">Mostrar menos</button>`;
    h+='</div>';
  } else h+=`<div class="card"><h2>A pagar</h2><p class="sub">Nada pendente em ${nomeMes(MES)}.</p></div>`;
  h+='</div>';

  /* cotas */
  const cs=cotas(), limC=verTudo.cot?cs.length:6;
  h+='<div><div class="card"><h2>Limites por categoria</h2>';
  if(!cs.length) h+='<p class="sub">Nenhuma cota definida.</p>';
  cs.slice(0,limC).forEach(c=>{
    const base=c.cota>0?c.cota:(c.total||1);
    const tag=c.estourou?'<span class="badge badge--danger">estourou</span>'
      :c.risco?'<span class="badge badge--gold">vai estourar</span>'
      :c.cota===0?'<span class="badge badge--dark">sem cota</span>':'';
    h+=`<div class="prog"><div class="cab">
      <div class="t">${esc(c.nome)}${tag}</div>
      <div class="v">${BRL(c.total)} <i>/ ${c.cota?BRL(c.cota):'—'}</i></div></div>
      ${barra([{w:c.gasto/base*100,c:c.estourou?'var(--danger)':'var(--gold)'},
               {w:c.previsto/base*100,c:c.estourou?'rgba(248,81,73,.32)':'rgba(255,186,26,.3)'}])}
      <div class="sub">${BRL(c.gasto)} pago · ${BRL(c.previsto)} a pagar${
        c.cota?' · '+(c.sobra>=0?'<b class="ok">sobram '+BRL(c.sobra)+'</b>':'<b class="bad">passou '+BRL(-c.sobra)+'</b>'):''}${
        c.origem==='suposicao'?' · cota estimada':''}</div></div>`});
  if(cs.length>limC) h+=`<button class="maisbtn" data-mais="cot">Ver as outras ${cs.length-limC}</button>`;
  else if(verTudo.cot&&cs.length>6) h+=`<button class="maisbtn" data-mais="cot">Mostrar menos</button>`;
  h+='</div></div>';
  h+='</div>';
  return h;
}

/* ============ ABA: DEGRAU ============ */
function abaDegrau(){
  let h='<div class="card card-deep"><h2>Degrau 1 &middot; posição</h2>';
  degrau().forEach(g=>{
    const cor=g.red?(g.atual>0?'var(--danger)':'var(--success)'):(g.prog>=100?'var(--success)':'var(--gold)');
    h+=`<div class="prog"><div class="cab">
      <div class="t">${esc(g.nome)}</div>
      <div class="v">${BRL(g.atual)} <i>${g.red?'→ zero':'/ '+BRL(g.piso)}</i></div></div>
      ${barra([{w:g.prog,c:cor}])}
      <div class="sub">${g.red
        ?(g.atual>0?`faltam <b>${BRL(g.atual)}</b> para zerar${g.semSaldo?` · ${g.semSaldo} sem saldo `+PRE:''}`:'zerado')
        :`<b>${Math.round(g.prog)}%</b> do piso · faltam ${BRL(g.falta)}${g.teto>g.piso?' · teto '+BRL(g.teto):''}`}
      </div></div>`});
  h+='</div><div class="colunas"><div>';

  const hb=BASE.habilidades.filter(x=>(x.status||'')==='em_foco')[0];
  if(hb){
    const vazia=!hb.habilidade||/PREENCHER/i.test(hb.habilidade);
    h+=`<div class="card"><h2>Próxima habilidade</h2>
      <div style="font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px">
        ${vazia?PRE:esc(hb.habilidade)}</div>
      <p class="sub" style="font-size:13.5px">${vazia?'Qual gargalo do Degrau 1 a próxima habilidade remove?':esc(hb.por_que_destrava_o_degrau||'')}</p>
      <div class="row" style="margin-top:14px"><div class="nm">Custo</div>
        <div class="vl">${num(hb.custo)!=null?BRL(num(hb.custo)):PRE}</div></div>
      <div class="row"><div class="nm">Prazo</div>
        <div class="vl">${hb.prazo?brData(hb.prazo):PRE}</div></div>
      <div class="hint">Uma por vez. Só entra a próxima quando esta virar receita ou for descartada.</div></div>`;
  }

  h+='<div class="card"><h2>Metas</h2>';
  metas().forEach(m=>{
    const chega=(m.nec!=null&&m.ritmo>0)?m.ritmo>=m.nec:null;
    h+=`<div class="prog"><div class="cab">
      <div class="t">${esc(m.nome)}</div>
      <div class="v">${BRL(m.atual)} <i>/ ${m.alvo!=null?BRL(m.alvo):''}</i>${m.alvo==null?' '+PRE:''}</div></div>
      ${barra([{w:m.alvo?m.atual/m.alvo*100:0,c:'var(--gold)'}])}
      <div class="sub">${m.nec!=null
        ?`${BRL(m.nec)}/mês por ${m.rest} meses · ritmo ${BRL(m.ritmo)}/mês ·
          <b class="${chega?'ok':'bad'}">${chega?'chega no prazo':'não chega'}</b>`
        :'sem valor alvo e data não dá para calcular o mensal'}</div></div>`});
  h+='</div></div><div>';

  if(BASE.filtros.length){
    h+='<div class="card card-deep"><h2>Filtro de tolerância</h2>';
    BASE.filtros.forEach(f=>{const v=num(f.valor);
      h+=`<div class="row"><div class="nm"><span class="bad" style="font-weight:800;margin-right:7px">&times;</span>
        ${esc(f.filtro)}</div><div class="vl">${f.tipo==='auditavel'?(v!=null?BRL(v):PRE):''}</div></div>`});
    h+=`<div class="hint">Os de percepção não são medidos aqui. Os auditáveis viram lei no dia em que
      tiverem número na aba <b>filtros</b>.</div></div>`;
  }
  h+='</div></div>';
  return h;
}

/* ============ ABA: DÍVIDAS ============ */
function abaDividas(){
  const ds=dividasAtivas();
  if(!ds.length) return '<div class="card"><h2>Dívidas</h2><p class="sub">Nenhuma dívida com saldo cadastrado.</p></div>';
  const catD=BASE.categorias.find(c=>c.grupo==='divida');
  const orc=window.__orc!=null?window.__orc:(num(catD&&catD.cota_mensal)||0);
  const av=[...ds].sort((a,b)=>(b.taxa||0)-(a.taxa||0)||a.saldo-b.saldo);
  const bn=[...ds].sort((a,b)=>a.saldo-b.saldo);
  const rA=simular(av,orc), rB=simular(bn,orc);
  const ordem=window.__ordem||'juros';
  const lista=ordem==='juros'?av:bn, r=ordem==='juros'?rA:rB;
  const semTaxa=ds.filter(d=>d.semTaxa).map(d=>d.nome);
  const semSaldo=BASE.dividas.filter(d=>num(d.saldo_atual)==null).length;

  let h=`<div class="hero" style="background:radial-gradient(130% 150% at 15% 0%,#3a2020 0%,#2a1618 60%,#1d1113 100%);color:var(--cream);box-shadow:none;border:1px solid rgba(248,81,73,.22)">
    <div class="eyebrow" style="color:rgba(255,248,230,.55)">Passivo total mapeado</div>
    <div class="valor" style="color:#ff8e89">${BRL(ds.reduce((s,d)=>s+d.saldo,0))}</div>
    <div class="sub">${ds.length} credores com saldo conhecido${semSaldo?` · ${semSaldo} ainda sem valor`:''}</div>
  </div>`;

  h+=`<div class="card"><h2>Simulação de quitação</h2>
    <div class="campo" style="margin-top:0"><span class="eyebrow">Quanto dá para pagar por mês, no total</span>
      <input type="text" id="orc" value="${orc}" inputmode="decimal" style="margin-top:8px"></div>
    <div class="seg" style="margin-top:20px">
      <button data-ordem="juros" class="${ordem==='juros'?'on':''}">Maior juros primeiro</button>
      <button data-ordem="saldo" class="${ordem==='saldo'?'on':''}">Menor saldo primeiro</button></div>
    <table><thead><tr><th>Ordem de ataque</th><th class="r">Saldo</th><th class="r">Taxa</th></tr></thead><tbody>
    ${lista.map((d,i)=>`<tr><td>${i+1}. ${esc(d.nome)}</td><td class="r">${BRL(d.saldo)}</td>
      <td class="r">${d.semTaxa?PRE:d.taxa+'%'}</td></tr>`).join('')}</tbody></table>
    <div class="row" style="margin-top:16px"><div class="nm">Custo em juros nesta ordem</div>
      <div class="vl">${r.impossivel?'—':BRL(r.juros)}</div></div>
    <div class="row"><div class="nm">Tempo até zerar tudo</div>
      <div class="vl">${r.impossivel?'—':r.meses+' meses'}</div></div>
    ${(!rA.impossivel&&!rB.impossivel)?`<div class="row"><div class="nm">Diferença entre as duas ordens</div>
      <div class="vl gold">${BRL(Math.abs(rA.juros-rB.juros))}</div></div>`:''}
    ${semTaxa.length?`<div class="aviso"><b>Este número ainda não é real.</b> Sem taxa cadastrada para:
      ${semTaxa.map(esc).join(', ')}. O cálculo tratou como juros zero — por isso as duas ordens custam quase
      o mesmo. Preencha <b>taxa_juros_mensal</b> na aba <b>dividas</b>.</div>`:''}
    <div class="hint">Não decido por você. Maior juros costuma custar menos dinheiro; menor saldo costuma
      dar mais tração. A diferença acima é o preço da escolha.</div></div>`;
  return h;
}

/* ============ ABA: HISTÓRICO ============ */
function abaHistorico(){
  const hs=historico().filter(x=>x.e||x.s);
  if(hs.length<2) return `<div class="card"><h2>Histórico</h2>
    <p class="sub">Só existe ${hs.length} mês com movimento. O gráfico aparece quando houver pelo menos dois —
    ele se preenche sozinho conforme você lança.</p>
    ${hs.length?`<div class="row" style="margin-top:16px"><div class="nm">${nomeMes(hs[0].mes)}</div>
      <div class="vl">entrou ${BRL(hs[0].e)} · saiu ${BRL(hs[0].s)}</div></div>`:''}</div>`;
  const mx=Math.max(1,...hs.map(x=>Math.max(x.e,x.s)));
  const W=340,H=130,bw=W/hs.length;
  return `<div class="card"><h2>Entradas e saídas</h2>
    <svg viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="xMidYMid meet">
    ${hs.map((x,i)=>{const he=x.e/mx*H,hd=x.s/mx*H,x0=i*bw;
      return `<rect x="${x0+bw*.14}" y="${H-he}" width="${bw*.32}" height="${he}" rx="2"
        fill="${x.fut?'rgba(255,186,26,.4)':'var(--gold)'}"/>
        <rect x="${x0+bw*.54}" y="${H-hd}" width="${bw*.32}" height="${hd}" rx="2"
        fill="${x.fut?'rgba(248,81,73,.4)':'var(--danger)'}"/>
        <text x="${x0+bw/2}" y="${H+14}" fill="rgba(255,248,230,.38)" font-size="8"
        text-anchor="middle" font-family="Plus Jakarta Sans">${nomeMes(x.mes)}</text>`}).join('')}
    </svg>
    <div class="sub" style="margin-top:10px"><span class="gold">■</span> entradas &nbsp;
      <span class="bad">■</span> saídas &nbsp;·&nbsp; tom fraco = ainda previsto</div>
    <table style="margin-top:18px"><thead><tr><th>Mês</th><th class="r">Entrou</th><th class="r">Saiu</th>
      <th class="r">Resultado</th></tr></thead><tbody>
    ${hs.map(x=>`<tr><td>${nomeMes(x.mes)}</td><td class="r">${BRL(x.e)}</td><td class="r">${BRL(x.s)}</td>
      <td class="r ${x.r<0?'bad':'ok'}"><b>${BRL(x.r)}</b></td></tr>`).join('')}
    </tbody></table></div>`;
}

function ligar(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
  document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>quitar(b.dataset.quitar,b));
  document.querySelectorAll('[data-mais]').forEach(b=>b.onclick=()=>{
    verTudo[b.dataset.mais]=!verTudo[b.dataset.mais]; render()});
  document.querySelectorAll('[data-ordem]').forEach(b=>b.onclick=()=>{
    window.__ordem=b.dataset.ordem; render()});
  const o=document.getElementById('orc');
  if(o) o.onchange=e=>{window.__orc=num(e.target.value)||0;render()};
  on('recarregar',()=>carregar(true));
  on('tentar',()=>carregar(true));
  on('conectar',()=>{CFG.limpar();location.reload()});
  on('trocar',()=>{CFG.limpar();location.reload()});
}

/* ---------- fluxo ---------- */
function mesInicial(){
  const at=comp(hoje);
  if(txDoMes(at).length) return at;
  const fut=BASE.transacoes.map(t=>(t.competencia||'').slice(0,7)).filter(m=>m>=at).sort();
  return fut[0]||at;
}
function mostrarApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('fab').style.display='';
}
function usarEmbutido(msg){
  BASE=lerEmbutido(); ONLINE=false; ULTIMO_ERRO=msg||''; MES=mesInicial();
  document.getElementById('fonteLbl').textContent='cópia local';
  render(); montarChips();
}
async function carregar(avisar){
  if(!CFG.url||!CFG.pin){ usarEmbutido(''); return }
  document.getElementById('fonteLbl').textContent='conectando…';
  try{
    const j=await api({acao:'base'});
    BASE=normalizar(j.base); ONLINE=true; ULTIMO_ERRO=''; MES=mesInicial();
    document.getElementById('fonteLbl').textContent='planilha · '+(j.servidor||'ao vivo');
    render(); montarChips();
    if(avisar) toast('Atualizado');
  }catch(e){
    usarEmbutido(e.message);
    toast('Sem conexão com a planilha — abrindo a cópia local',4200);
  }
}
async function quitar(id,btn){
  if(!ONLINE) return toast('Conecte a planilha para dar baixa');
  if(ocupado) return; ocupado=true;
  const t=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  try{ const j=await api({acao:'quitar',id}); BASE=normalizar(j.base); render(); toast('Baixado do caixa') }
  catch(e){ toast('Erro: '+e.message,4200); btn.textContent=t }
  finally{ ocupado=false }
}
async function lancar(){
  const v=num(document.getElementById('fValor').value);
  if(!v||v<=0) return toast('Informe o valor');
  if(!CAT) return toast('Escolha a categoria');
  if(!CONTA) return toast('Escolha a conta');
  if(!ONLINE) return toast('Modo leitura: conecte a planilha para gravar');
  if(ocupado) return; ocupado=true;
  const b=document.getElementById('fOk'); b.innerHTML='<span class="spin"></span>';
  try{
    const j=await api({acao:'lancar',valor:v,tipo:TIPO,categoria:CAT,conta:CONTA,
      descricao:document.getElementById('fDesc').value||'',data:ymd(hoje)});
    BASE=normalizar(j.base); MES=comp(hoje); ABA='hoje'; fecharFolha(); render();
    toast((TIPO==='saida'?'− ':'+ ')+BRL(v)+' em '+CAT);
  }catch(e){ toast('Erro: '+e.message,4200) }
  finally{ b.textContent='Confirmar'; ocupado=false }
}
function montarChips(){
  document.getElementById('fCats').innerHTML=BASE.categorias
    .map(c=>`<button class="chip" data-cat="${esc(c.nome)}">${esc(c.nome)}</button>`).join('');
  document.getElementById('fContas').innerHTML=BASE.contas
    .map(c=>`<button class="chip" data-conta="${esc(c.id)}">${esc(c.nome)}</button>`).join('');
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');CAT=b.dataset.cat});
  document.querySelectorAll('[data-conta]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-conta]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');CONTA=b.dataset.conta});
}
function abrirFolha(){
  document.getElementById('sheet').classList.add('on');
  setTimeout(()=>document.getElementById('fValor').focus(),120);
}
function fecharFolha(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('fValor').value='';
  document.getElementById('fDesc').value='';
  document.querySelectorAll('[data-cat],[data-conta]').forEach(x=>x.classList.remove('on'));
  CAT='';CONTA='';
}

/* ---------- eventos ---------- */
document.querySelectorAll('nav.abas button').forEach(b=>b.onclick=()=>{
  ABA=b.dataset.aba; window.scrollTo({top:0,behavior:'smooth'}); render()});
document.getElementById('prev').onclick=()=>{MES=addMes(MES,-1);render()};
document.getElementById('next').onclick=()=>{MES=addMes(MES,1);render()};
document.getElementById('fab').onclick=abrirFolha;
document.getElementById('fCancel').onclick=fecharFolha;
document.getElementById('fOk').onclick=lancar;
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')fecharFolha()};
document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tipo]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');TIPO=b.dataset.tipo;
  document.getElementById('sheetSub').textContent=
    TIPO==='saida'?'Sai do caixa na hora.':'Entra no caixa na hora.'});
document.getElementById('gSkip').onclick=()=>{mostrarApp();usarEmbutido('')};
document.getElementById('gBtn').onclick=async()=>{
  const u=document.getElementById('gUrl').value.trim();
  const p=document.getElementById('gPin').value.trim();
  if(!u||!p) return toast('Preencha os dois campos');
  if(!/\/exec\s*$/.test(u)) return toast('A URL precisa terminar em /exec');
  CFG.url=u;CFG.pin=p;
  const b=document.getElementById('gBtn'); b.innerHTML='<span class="spin"></span>';
  try{ await api({acao:'base'}); mostrarApp(); carregar() }
  catch(e){
    document.getElementById('gateMsg').innerHTML=
      '<span class="bad">'+esc(e.message)+'</span><br>Entre assim mesmo para ver o diagnóstico.';
    b.textContent='Conectar';
    document.getElementById('gSkip').textContent='Entrar e ver o que houve';
  }
};
if(CFG.url&&CFG.pin){ mostrarApp(); carregar() }

</script>
</body>
</html>
